server.port=${SERVER_PORT:8105}
spring.application.name=google-maps-gateway
google.maps.service-token=${GOOGLE_MAPS_GATEWAY_TOKEN}
google.maps.enabled=${GOOGLE_MAPS_ENABLED:false}
google.maps.api-key=${GOOGLE_MAPS_API_KEY:}
google.maps.places-base-url=${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com}
google.maps.routes-base-url=${GOOGLE_ROUTES_BASE_URL:https://routes.googleapis.com}
google.maps.connect-timeout=${GOOGLE_MAPS_CONNECT_TIMEOUT:500ms}
google.maps.read-timeout=${GOOGLE_MAPS_READ_TIMEOUT:4s}
google.maps.session-ttl=${GOOGLE_MAPS_SESSION_TTL:10m}
google.maps.maximum-sessions=${GOOGLE_MAPS_MAXIMUM_SESSIONS:10000}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
